<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Люди</title>
</head>
<body>
  <div th:each="person : ${people}">
    <a th:href="@{/people/{id}(id=${person.getPersonId()})}" th:text="${person.getFullName() + ', ' + person.getYearOfBirth()}">Name, age</a>

  </div>
  <br/>
  <a href="people/new">Добавить человека</a>
</body>
</html>
