<!DOCTYPE html>
<html lang="en" xmlns:th="http://tympleaf.com">
<head>
    <meta charset="UTF-8">
    <title>Добавление человека</title>
</head>
<body>
  <form th:method="POST" th:action="@{/people}" th:object="${person}">
    <label for="fullName">Введите ФИО:</label>
    <input id="fullName" type="text" th:field="*{fullName}"/>
    <br/>
    <label for="yearOfBirth">Введите год рождения:</label>
    <input id="yearOfBirth" type="text" th:field="*{yearOfBirth}">
    <br/>
    <input type="submit" value="Добавить человека"/>
  </form>
</body>
</html>
