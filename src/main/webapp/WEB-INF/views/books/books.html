<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymleaf.com">
<head>
    <meta charset="UTF-8">
    <title>Все книги</title>
</head>
<body>
    <div th:each="book : ${books}">
        <a th:href="@{/books/{id}(id=${book.getBookId()})}" th:text="${book.getName() + ',' + book.getAuthor() + ',' + book.getYearProduction()}">Name,Author,YearProduction</a>
    </div>
    <form th:method="GET" th:action="@{/books/new}">
        <input type="submit" value="Добавить книгу">
    </form>
</body>
</html>
